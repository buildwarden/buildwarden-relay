[package]
name = "hello-vz"
version = "0.0.0"
edition = "2024"
publish = false

# Stage A's app: like upstream hello_world, but it waits before exiting, so a
# hypervisor that drains the virtio console asynchronously (VZ) has written
# the output before the guest powers off.

[target.'cfg(target_os = "hermit")'.dependencies]
hermit = { path = "../../.work/hermit-rs/hermit", default-features = false, features = ["acpi", "pci", "virtio-console"] }

[workspace]
